[project]
name = "bilingua"
version = "0.2.0"
description = "A reproducible, resumable workflow for paragraph-aligned bilingual books"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ling"}]
keywords = ["translation", "bilingual", "markdown", "obsidian", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bilingua = "pipeline.cli:main"

[project.urls]
Repository = "https://github.com/lingjiee/bilingua-workflow"
Issues = "https://github.com/lingjiee/bilingua-workflow/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
